<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школа Англійської мови Cat teacher</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Comfortaa & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfd;
            color: #111827;
        }

        .brand-font {
            font-family: 'Comfortaa', cursive, sans-serif;
        }

        .arc-text {
            font-family: 'Comfortaa', cursive, sans-serif;
            font-weight: 700;
            fill: #111827;
        }

        .card-sketch {
            border: 2px solid #111827;
            border-radius: 1.25rem;
            box-shadow: 4px 4px 0px #111827;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .card-sketch:hover {
            box-shadow: 6px 6px 0px #111827;
        }

        .pill-sketch {
            border: 2px solid #111827;
            border-radius: 9999px;
            box-shadow: 2px 2px 0px #111827;
            background: #ffffff;
        }

        .btn-sketch {
            border: 2px solid #111827;
            border-radius: 0.75rem;
            box-shadow: 3px 3px 0px #111827;
            font-weight: 600;
            transition: all 0.15s ease;
            background-color: #ffffff;
        }

        .btn-sketch:hover {
            transform: translateY(-1px);
            box-shadow: 4px 4px 0px #111827;
        }

        .btn-sketch:active {
            transform: translateY(2px);
            box-shadow: 1px 1px 0px #111827;
        }

        @keyframes bongoPawLeft {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-10deg); }
        }
        @keyframes bongoPawRight {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(10deg); }
        }

        .paw-left {
            animation: bongoPawLeft 0.5s infinite ease-in-out;
            transform-origin: bottom right;
        }

        .paw-right {
            animation: bongoPawRight 0.5s infinite ease-in-out 0.25s;
            transform-origin: bottom left;
        }

        .modal-overlay {
            background-color: rgba(17, 24, 39, 0.4);
            backdrop-filter: blur(4px);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <div class="relative flex flex-col items-center max-w-md w-full">
            <svg viewBox="0 0 500 150" class="w-full h-36">
                <path id="curve" fill="transparent" d="M 50,130 A 200,100 0 0,1 450,130" />
                <text font-size="22" class="arc-text" text-anchor="middle">
                    <textPath href="#curve" startOffset="50%">
                        Школа Англійської мови Cat teacher
                    </textPath>
                </text>
            </svg>

            <div class="w-48 h-36 relative -mt-6">
                <svg viewBox="0 0 200 140" class="w-full h-full">
                    <path d="M 30,120 C 30,60 60,40 100,40 C 140,40 170,60 170,120 Z" fill="#ffffff" stroke="#111827" stroke-width="4" />
                    <polygon points="50,55 35,25 70,45" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="150,55 165,25 130,45" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="52,50 42,32 65,45" fill="#f472b6" />
                    <polygon points="148,50 158,32 135,45" fill="#f472b6" />
                    <circle cx="75" cy="70" r="5" fill="#111827" />
                    <circle cx="125" cy="70" r="5" fill="#111827" />
                    <path d="M 90,80 Q 95,87 100,80 Q 105,87 110,80" fill="transparent" stroke="#111827" stroke-width="3" stroke-linecap="round" />
                    <ellipse class="paw-left" cx="55" cy="105" rx="14" ry="10" fill="#ffffff" stroke="#111827" stroke-width="3" />
                    <ellipse class="paw-right" cx="145" cy="105" rx="14" ry="10" fill="#ffffff" stroke="#111827" stroke-width="3" />
                    <line x1="10" y1="120" x2="190" y2="120" stroke="#111827" stroke-width="4" stroke-linecap="round" />
                </svg>
            </div>

            <button onclick="hideSplash()" class="mt-8 btn-sketch px-8 py-3 text-lg bg-yellow-300 hover:bg-yellow-400">
                Зайти в школу <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Header Navigation Bar -->
    <header class="bg-white border-b-2 border-gray-900 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchRoleToggle()">
                <div class="w-12 h-10 relative">
                    <svg viewBox="0 0 200 140" class="w-full h-full">
                        <path d="M 30,120 C 30,60 60,40 100,40 C 140,40 170,60 170,120 Z" fill="#ffffff" stroke="#111827" stroke-width="6" />
                        <polygon points="50,55 35,25 70,45" fill="#ffffff" stroke="#111827" stroke-width="6" />
                        <polygon points="150,55 165,25 130,45" fill="#ffffff" stroke="#111827" stroke-width="6" />
                        <circle cx="75" cy="70" r="7" fill="#111827" />
                        <circle cx="125" cy="70" r="7" fill="#111827" />
                        <path d="M 90,82 Q 100,92 110,82" fill="transparent" stroke="#111827" stroke-width="5" />
                    </svg>
                </div>
                <div class="pill-sketch px-4 py-1.5 hidden sm:block">
                    <span class="brand-font font-bold text-sm sm:text-base">Школа Англійської мови Cat teacher</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2 border-2 border-gray-900 rounded-full p-1 pr-3 bg-white">
                    <div class="w-8 h-8 rounded-full bg-gray-900 text-white flex items-center justify-center font-bold text-xs" id="user-avatar-text">МО</div>
                    <div class="text-xs">
                        <div class="font-bold leading-tight" id="user-name-text">Марія Олександрівна</div>
                        <div class="text-gray-500 text-[10px]" id="user-role-text">Вчитель</div>
                    </div>
                </div>
                <button class="btn-sketch px-3 py-1.5 text-xs bg-yellow-300" onclick="switchRoleToggle()"><i class="fa-solid fa-arrows-rotate mr-1"></i> Змінити роль</button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- STUDENT DASHBOARD -->
        <div id="view-student-dashboard" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <div class="md:col-span-8 flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-4">
                    <div class="pill-sketch px-8 py-3 text-center w-full sm:w-auto">
                        <span class="text-2xl font-bold brand-font">Група 1.6</span>
                    </div>
                    <div class="pill-sketch px-6 py-2.5 text-center bg-gray-50 w-full sm:w-auto">
                        <span class="text-lg font-semibold">Чаленко Данилко</span>
                    </div>
                </div>

                <div class="md:col-span-4 flex items-center justify-end space-x-3">
                    <div class="pill-sketch px-4 py-2 flex items-center space-x-2 bg-green-50 border-green-800">
                        <span class="text-2xl font-bold text-green-700">87 %</span>
                        <span class="text-xs text-gray-600 font-medium leading-tight">середня<br>оцінка</span>
                    </div>

                    <button onclick="openCalendarModal()" class="btn-sketch px-4 py-2.5 flex items-center space-x-2 bg-blue-50 hover:bg-blue-100">
                        <span class="text-sm font-bold">календар занять</span>
                        <i class="fa-regular fa-calendar-days text-xl"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Column 1: Пройдений матеріал -->
                <div class="card-sketch p-5 flex flex-col h-full">
                    <div class="pill-sketch px-4 py-2 text-center font-bold text-lg mb-4 bg-gray-50">Пройдений матеріал</div>
                    <div id="student-past-lessons" class="space-y-3 overflow-y-auto max-h-96 pr-1 flex-1"></div>
                </div>

                <!-- Column 2: завдане д\з -->
                <div class="card-sketch p-5 flex flex-col h-full">
                    <div class="pill-sketch px-4 py-2 text-center font-bold text-lg mb-4 bg-yellow-50">завдане д\з</div>
                    <div id="student-current-hw" class="space-y-3 overflow-y-auto max-h-96 pr-1 flex-1"></div>
                </div>

                <!-- Column 3: наступні уроки -->
                <div class="card-sketch p-5 flex flex-col h-full">
                    <div class="pill-sketch px-4 py-2 text-center font-bold text-lg mb-4 bg-blue-50">наступні уроки</div>
                    <div id="student-upcoming-lessons" class="space-y-3 overflow-y-auto max-h-96 pr-1 flex-1"></div>
                </div>
            </div>
        </div>

        <!-- TEACHER DASHBOARD -->
        <div id="view-teacher-dashboard" class="space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="pill-sketch px-6 py-2 bg-yellow-100">
                    <h2 class="text-xl font-bold brand-font">Вітаємо, Марія Олександрівна</h2>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button onclick="openGradeBookModal()" class="btn-sketch px-4 py-2 bg-green-100 text-sm">
                        <i class="fa-solid fa-graduation-cap mr-1"></i> Журнал оцінок учнів
                    </button>
                    <button onclick="openCalendarModal()" class="btn-sketch px-4 py-2 bg-blue-50 text-sm">
                        <i class="fa-regular fa-calendar-plus mr-1"></i> Додати урок / тему
                    </button>
                    <button onclick="openAddTeacherModal()" class="btn-sketch px-4 py-2 bg-purple-100 text-sm">
                        <i class="fa-solid fa-user-plus mr-1"></i> Додати вчителя
                    </button>
                </div>
            </div>

            <!-- 3 Columns: Групи | Індивідуальні | Корисні посилання -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Panel 1: Групи -->
                <div class="card-sketch p-5 flex flex-col h-full">
                    <div class="pill-sketch px-4 py-2 text-center font-bold text-lg mb-4 bg-gray-50">групи</div>
                    <div id="teacher-groups-list" class="space-y-3"></div>
                </div>

                <!-- Panel 2: Індивідуальні -->
                <div class="card-sketch p-5 flex flex-col h-full">
                    <div class="pill-sketch px-4 py-2 text-center font-bold text-lg mb-4 bg-gray-50">індивідуальні</div>
                    <div id="teacher-indiv-list" class="space-y-3"></div>
                </div>

                <!-- Panel 3: Корисні посилання (тільки плюсик) -->
                <div class="card-sketch p-5 flex flex-col h-full">
                    <div class="pill-sketch px-4 py-2 text-center font-bold text-lg mb-4 bg-gray-50">корисні посилання</div>
                    <div id="useful-links-grid" class="grid grid-cols-2 gap-4 flex-1">
                        <!-- Square Plus Button -->
                        <div onclick
